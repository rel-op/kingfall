<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KINGFALL - pixel battle chess</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07050c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kingfall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
  /* fixed in place and deaf to browser gestures, so a tap is a move and nothing scrolls or zooms */
  html, body { margin: 0; height: 100%; background: #07050c; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  #game { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; }
  #turn { display: none; position: fixed; inset: 0; z-index: 2; background: #07050c; color: #ffd23e; font: 600 20px/1.4 system-ui, sans-serif;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 24px; }
  #turn b { font-size: 60px; line-height: 1; }
  @media (orientation: portrait) and (max-width: 600px) { #turn { display: flex; } }
</style>
</head>
<body>
<div id="turn"><b>&#10227;</b>Turn your phone sideways to play</div>
<canvas id="game" width="1920" height="1080"></canvas>
<script src="assets/atlas.js"></script>
<script src="assets/fx.js"></script>
<script src="assets/sfx.js"></script>
<script src="js/chess.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/gfx.js"></script>
<script src="js/view.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/fight.js"></script>
<script src="js/ui.js"></script>
<script src="js/sys.js"></script>
<script src="js/app.js"></script>
<script src="js/main.js"></script>
</body>
</html>
